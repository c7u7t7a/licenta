<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Race Timer — Rover</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --bg:          #06080f;
      --surface:     #0b0e18;
      --card:        #0f1320;
      --border:      rgba(255,255,255,0.06);
      --border-hi:   rgba(91,141,239,0.35);
      --accent:      #5b8def;
      --accent-glow: rgba(91,141,239,0.22);
      --green:       #00d68f;
      --green-glow:  rgba(0,214,143,0.18);
      --red:         #ff4757;
      --yellow:      #ffa502;
      --text:        #e2e8ff;
      --text-dim:    #8892b0;
      --muted:       #4a5275;
      --radius:      14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      font-size: 13.5px;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 56px;
      background: rgba(11,14,24,0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }

    header h1 {
      font-size: 16px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .back-btn {
      padding: 6px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      text-decoration: none;
      transition: all .18s;
    }
    .back-btn:hover {
      border-color: var(--border-hi);
      color: var(--accent);
      background: var(--accent-glow);
    }

    .main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255,255,255,0.025) 0%, transparent 60%);
      pointer-events: none;
    }

    /* ── Main timer display ── */
    .timer-display {
      text-align: center;
      padding: 32px 0;
    }

    .timer-main {
      font-size: 86px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 3px;
      color: var(--text);
      transition: color .3s, text-shadow .3s;
      line-height: 1;
    }

    .timer-main.running {
      color: var(--green);
      text-shadow: 0 0 40px rgba(0,214,143,0.3);
    }
    .timer-main.stopped {
      color: var(--yellow);
      text-shadow: 0 0 30px rgba(255,165,2,0.2);
    }

    .timer-lap {
      font-size: 28px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 10px;
      font-variant-numeric: tabular-nums;
    }

    .timer-lap span { color: var(--accent); }

    /* ── Stats row ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      transition: border-color .2s;
    }

    .stat-box:hover { border-color: rgba(255,255,255,0.1); }

    .stat-val {
      font-size: 24px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stat-lbl {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: .8px;
    }

    /* ── Controls ── */
    .ctrl-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 28px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      transition: all .18s cubic-bezier(.25,.46,.45,.94);
      min-width: 120px;
    }

    .btn:hover { border-color: rgba(91,141,239,0.5); color: var(--accent); background: var(--accent-glow); }

    .btn.start { border-color: rgba(0,214,143,0.4); color: var(--green); }
    .btn.start:hover, .btn.start.active {
      background: linear-gradient(135deg, var(--green), #00a86b);
      border-color: var(--green); color: #fff;
      box-shadow: 0 0 20px rgba(0,214,143,0.25);
    }

    .btn.lap { border-color: rgba(91,141,239,0.4); color: var(--accent); }
    .btn.lap:hover, .btn.lap.active {
      background: linear-gradient(135deg, var(--accent), #3a6fd8);
      border-color: var(--accent); color: #fff;
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .btn.lap:disabled { opacity: .25; cursor: default; box-shadow: none; }

    .btn.stop { border-color: rgba(255,165,2,0.4); color: var(--yellow); }
    .btn.stop:hover {
      background: rgba(255,165,2,0.15);
      border-color: var(--yellow); color: var(--yellow);
    }
    .btn.stop:disabled { opacity: .25; cursor: default; }

    .btn.reset { border-color: rgba(255,71,87,0.35); color: var(--red); }
    .btn.reset:hover {
      background: rgba(255,71,87,0.12);
      border-color: var(--red); color: var(--red);
    }

    /* ── Keyboard hint ── */
    .kbd-hint {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 10px;
    }

    kbd {
      display: inline-block;
      padding: 1px 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      font-size: 10px;
    }

    /* ── Lap table ── */
    .lap-table-wrap {
      max-height: 380px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      text-align: left;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
    }

    tr:last-child td { border-bottom: none; }
    tr.best td { color: var(--green); font-weight: 700; }
    tr.worst td { color: var(--red); }

    .lap-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }

    .empty-laps {
      text-align: center;
      padding: 32px;
      color: var(--muted);
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .timer-main { font-size: 52px; }
      .stats-row { grid-template-columns: 1fr 1fr; }
    }
  
    /* -- Light mode (shared cu index, cheia localStorage 'rover-theme') -- */
    body.light {
      --bg:          #eceff5;
      --surface:     #ffffff;
      --card:        #ffffff;
      --card-hover:  #f3f6fc;
      --border:      rgba(15,23,42,0.20);
      --border-hi:   #1d4ed8;
      --accent:      #1d4ed8;
      --accent-dim:  #1e40af;
      --accent-glow: rgba(29,78,216,0.20);
      --green:       #15803d;
      --green-glow:  rgba(21,128,61,0.20);
      --red:         #dc2626;
      --red-glow:    rgba(220,38,38,0.20);
      --yellow:      #b45309;
      --purple:      #7c3aed;
      --cyan:        #0e7490;
      --text:        #000000;
      --text-dim:    #000000;
      --muted:       #1e293b;
    }
    body { transition: background .25s, color .25s; }
    .theme-fab {
      position: fixed; bottom: 18px; right: 18px; z-index: 9999;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--card);
      color: var(--text); cursor: pointer; font-size: 18px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.30); transition: all .2s;
    }
    .theme-fab:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
</style>
</head>

<body>
  <button class="theme-fab" onclick="toggleTheme()" title="Schimba tema">🌙</button>


  <header>
    <h1>&#9202; Race Timer</h1>
    <a href="/" class="back-btn">&#8592; Dashboard</a>
  </header>

  <div class="main">

    <!-- ── Timer card ── -->
    <div class="card">
      <div class="timer-display">
        <div class="timer-main" id="timerMain">00:00.000</div>
        <div class="timer-lap">Tur curent: <span id="lapTimer">00:00.000</span></div>

        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-val" id="statLaps">0</div>
            <div class="stat-lbl">Tururi</div>
          </div>
          <div class="stat-box">
            <div class="stat-val" id="statBest" style="color:var(--green)">—</div>
            <div class="stat-lbl">Cel mai bun tur</div>
          </div>
          <div class="stat-box">
            <div class="stat-val" id="statAvg">—</div>
            <div class="stat-lbl">Medie tururi</div>
          </div>
          <div class="stat-box">
            <div class="stat-val" id="statLast">—</div>
            <div class="stat-lbl">Ultimul tur</div>
          </div>
        </div>
      </div>

      <div class="ctrl-row">
        <button class="btn start" id="btnStart" onclick="raceStart()">&#9654; Start</button>
        <button class="btn lap"   id="btnLap"   onclick="raceLap()"   disabled>&#9872; Tur</button>
        <button class="btn stop"  id="btnStop"  onclick="raceStop()"  disabled>&#9646;&#9646; Stop</button>
        <button class="btn reset" id="btnReset" onclick="raceReset()">&#8635; Reset</button>
      </div>

      <div class="kbd-hint">
        <kbd>Space</kbd> Start / Tur &nbsp;&bull;&nbsp;
        <kbd>S</kbd> Stop &nbsp;&bull;&nbsp;
        <kbd>R</kbd> Reset
      </div>
    </div>

    <!-- ── Lap history card ── -->
    <div class="card">
      <div style="font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
                  color:var(--muted);margin-bottom:14px">
        &#9776; Istoricul Tururilor
      </div>
      <div class="lap-table-wrap">
        <table id="lapTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Timp Tur</th>
              <th>Diferență față de cel mai bun</th>
              <th>Timp total</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="lapTbody">
            <tr><td colspan="5" class="empty-laps">Niciun tur înregistrat</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div><!-- .main -->

  <script>
    const socket = io({ transports: ['websocket', 'polling'] });

    let raceRunning = false;
    let lapTimes    = [];
    let bestLap     = null;

    // ── Helpers ──────────────────────────────────────────────────────────────
    function fmtTime(sec) {
      if (sec == null || isNaN(sec)) return '—';
      const m   = Math.floor(sec / 60);
      const s   = Math.floor(sec % 60);
      const ms  = Math.round((sec % 1) * 1000);
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(3,'0')}`;
    }

    function fmtDiff(sec, best) {
      if (best == null || sec == null) return '—';
      const d = sec - best;
      if (Math.abs(d) < 0.001) return '±0.000';
      return (d > 0 ? '+' : '') + d.toFixed(3) + 's';
    }

    // ── UI updates ────────────────────────────────────────────────────────────
    function updateTimerDisplay(d) {
      const mainEl = document.getElementById('timerMain');
      mainEl.textContent = fmtTime(d.elapsed || 0);
      mainEl.className   = 'timer-main ' + (d.active ? 'running' : (d.elapsed > 0 ? 'stopped' : ''));

      document.getElementById('lapTimer').textContent = fmtTime(d.lap_elapsed || 0);
      document.getElementById('statLaps').textContent = d.lap_count ?? 0;
      document.getElementById('statBest').textContent = d.best_lap != null ? fmtTime(d.best_lap) : '—';

      lapTimes = d.laps || [];
      bestLap  = d.best_lap;

      // Average
      if (lapTimes.length > 0) {
        const avg = lapTimes.reduce((a, b) => a + b, 0) / lapTimes.length;
        document.getElementById('statAvg').textContent = fmtTime(avg);
      } else {
        document.getElementById('statAvg').textContent = '—';
      }

      // Last lap
      document.getElementById('statLast').textContent =
        lapTimes.length > 0 ? fmtTime(lapTimes[lapTimes.length - 1]) : '—';
    }

    function renderLapTable() {
      const tbody = document.getElementById('lapTbody');
      if (lapTimes.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-laps">Niciun tur înregistrat</td></tr>';
        return;
      }

      // Compute cumulative times
      let cumulative = [];
      let sum = 0;
      for (const t of lapTimes) { sum += t; cumulative.push(sum); }

      const worstLap = Math.max(...lapTimes);

      tbody.innerHTML = lapTimes.map((t, i) => {
        const isBest  = bestLap != null && Math.abs(t - bestLap) < 0.001;
        const isWorst = lapTimes.length > 1 && Math.abs(t - worstLap) < 0.001 && !isBest;
        const rowCls  = isBest ? 'class="best"' : (isWorst ? 'class="worst"' : '');
        const badge   = isBest
          ? '<span class="lap-badge" style="background:#2dce8944;color:#2dce89">BEST</span>'
          : (isWorst ? '<span class="lap-badge" style="background:#f75d5d44;color:#f75d5d">SLOW</span>' : '');
        return `<tr ${rowCls}>
          <td>${i + 1}</td>
          <td>${fmtTime(t)}</td>
          <td style="color:${isBest ? '#2dce89' : t > bestLap ? '#f75d5d' : 'var(--text)'}">${fmtDiff(t, bestLap)}</td>
          <td>${fmtTime(cumulative[i])}</td>
          <td>${badge}</td>
        </tr>`;
      }).reverse().join('');
    }

    function syncButtons(active) {
      raceRunning = active;
      document.getElementById('btnStart').disabled = active;
      document.getElementById('btnLap').disabled   = !active;
      document.getElementById('btnStop').disabled  = !active;
    }

    // ── Socket events ─────────────────────────────────────────────────────────
    socket.on('race_state', d => {
      syncButtons(d.active);
      updateTimerDisplay(d);
      renderLapTable();
    });

    socket.on('race_tick', d => {
      if (!raceRunning) return;
      document.getElementById('timerMain').textContent = fmtTime(d.elapsed || 0);
      document.getElementById('lapTimer').textContent  = fmtTime(d.lap_elapsed || 0);
    });

    // ── Controls ──────────────────────────────────────────────────────────────
    function raceStart() { socket.emit('race_start'); }
    function raceLap()   { socket.emit('lap_trigger'); }
    function raceStop()  { socket.emit('race_stop'); }
    function raceReset() { socket.emit('race_reset'); }

    // ── Keyboard shortcuts ────────────────────────────────────────────────────
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === ' ') {
        e.preventDefault();
        if (!raceRunning) raceStart(); else raceLap();
      } else if (e.key.toLowerCase() === 's') {
        if (raceRunning) raceStop();
      } else if (e.key.toLowerCase() === 'r') {
        raceReset();
      }
    });
  </script>
  <script>
    (function () {
      const KEY = 'rover-theme';
      window.applyTheme = function (t) {
        const light = t === 'light';
        document.body.classList.toggle('light', light);
        const b = document.querySelector('.theme-fab');
        if (b) b.textContent = light ? '🌞' : '🌙';
      };
      window.toggleTheme = function () {
        const cur = document.body.classList.contains('light') ? 'light' : 'dark';
        const next = cur === 'light' ? 'dark' : 'light';
        localStorage.setItem(KEY, next);
        applyTheme(next);
      };
      applyTheme(localStorage.getItem(KEY) || 'dark');
    })();
  </script>
</body>

</html>
